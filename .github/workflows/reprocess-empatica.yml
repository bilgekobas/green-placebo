name: Reprocess Empatica EDA and BVP (reviewer analysis)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reviewer-reanalysis
          lfs: true
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install source-processing dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scipy>=1.11,<2' 'openpyxl>=3.1,<4' 'neurokit2>=0.2.9,<0.3' 'heartpy>=1.2.7,<2'
      - name: Reprocess raw EDA at 4 Hz and BVP at 64 Hz
        run: python 04_reanalysis/03_reprocess_eda_bvp.py
      - name: Upload audit outputs (candidate quality, not clinical validation)
        uses: actions/upload-artifact@v4
        with:
          name: empatica-candidate-reprocessing
          path: |
            04_reanalysis/outputs/eda_neurokit2_4hz_1min.csv
            04_reanalysis/outputs/bvp_heartpy_hrv_window_qc.csv
            04_reanalysis/outputs/raw_reprocessing_inventory.csv
            04_reanalysis/outputs/processing_summary.json
      - name: Commit versioned derived outputs to reviewer branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f 04_reanalysis/outputs/eda_neurokit2_4hz_1min.csv 04_reanalysis/outputs/bvp_heartpy_hrv_window_qc.csv 04_reanalysis/outputs/raw_reprocessing_inventory.csv 04_reanalysis/outputs/processing_summary.json
          git diff --cached --quiet || git commit -m "Record reproducible EDA and BVP candidate reprocessing outputs"
          git push origin HEAD:reviewer-reanalysis
